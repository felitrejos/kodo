name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    # Kodo needs the macOS 26 SDK and Swift 6.2, which come with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: ./scripts/build-app.sh
